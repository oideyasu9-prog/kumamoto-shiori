<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>熊本 夜のクエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=BIZ+UDPGothic:wght@400;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{--bg:#0b0e1a;--panel:#141a33;--line:#2e3760;--ink:#f3efe6;--sub:#a6adcf;--gold:#ffd27a;--pink:#ff5c93;--blue:#5ab0ff;--green:#7fd18b;--yellow:#f2c14e;--purple:#c58bff;
 --dot:"DotGothic16","BIZ UDPGothic",sans-serif;--go:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--go);-webkit-tap-highlight-color:transparent;word-break:auto-phrase;line-break:strict}
.nb{display:inline-block}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(#0b0e1a,#0b0e1aee);border-bottom:2px solid var(--line);display:flex;align-items:center;gap:10px;z-index:1000}
h1{font-family:var(--dot);font-weight:400;font-size:21px;margin:0;line-height:1.1;letter-spacing:.04em;text-shadow:0 0 8px #ff5c9388}
h1 em{font-style:normal;color:var(--pink)}
.hud{margin-left:auto;display:flex;gap:6px;font-family:var(--dot);font-size:13px}
.hud span{border:2px solid var(--line);padding:3px 7px;background:#10152b;white-space:nowrap}
.hud b{color:var(--gold);font-weight:400}
#map{flex:1;background:#0b0e1a;position:relative}

.leaflet-control-attribution{background:#0b0e1acc!important;color:var(--sub)!important;font-size:9px}
.leaflet-control-attribution a{color:var(--sub)!important}
.leaflet-control-zoom a{background:#141a33!important;color:var(--ink)!important;border-color:var(--line)!important}
.pin{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--dot);font-size:16px;color:#0b0e1a;border:3px solid #0b0e1a;box-shadow:0 0 0 2px #ffffff22,0 0 14px currentColor;position:relative}
.pin span{color:#0b0e1a}
.pin.done::after{content:"済";position:absolute;right:-10px;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#0b0e1a;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid #0b0e1a;font-family:var(--go);font-weight:700}
.pin.secret{animation:float 2.4s ease-in-out infinite}
.home{width:40px;height:40px;border-radius:8px;background:var(--ink);color:#0b0e1a;font-family:var(--dot);font-size:22px;display:flex;align-items:center;justify-content:center;border:3px solid #0b0e1a}
.home.en{background:var(--gold);font-size:17px}
.hero{width:44px;height:52px;filter:drop-shadow(0 0 6px #ffd27a)}
.hero.walk{animation:bob .28s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes float{50%{transform:translateY(-5px)}}
nav.tabs{display:flex;gap:6px;padding:8px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));background:#0b0e1a;border-top:2px solid var(--line);z-index:1000;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:none;font-family:var(--dot);font-size:14px;color:var(--ink);background:#141a33;border:2px solid var(--line);padding:7px 11px;border-radius:0;cursor:pointer}
nav.tabs button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
nav.tabs i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:0}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1100;background:var(--panel);border-top:3px solid var(--gold);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 30px #000a;max-height:72%;overflow:auto;transform:translateY(0);transition:transform .25s ease}
.sheet[hidden]{display:block!important;transform:translateY(110%)}
.sheet .close{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--sub);font-size:26px;cursor:pointer;line-height:1}
.kind{font-family:var(--dot);font-size:13px;letter-spacing:.06em}
.sheet h2{margin:2px 34px 4px 0;font-size:22px;line-height:1.3}
.fun{color:var(--gold);font-weight:700;margin:0 0 8px;font-size:15px}
.scores{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.scores span{font-size:13px;border:1px solid var(--line);padding:3px 8px;background:#0f1430}
.scores b{font-size:16px;color:var(--gold)}
dl{display:grid;grid-template-columns:5em 1fr;gap:4px 10px;margin:0 0 12px;font-size:14px}
dt{color:var(--sub)} dd{margin:0;min-width:0}
.tel{font-size:17px;font-weight:700;letter-spacing:.02em;user-select:all;white-space:nowrap}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts a,.acts button{font-family:var(--dot);font-size:15px;text-align:center;padding:11px 6px;border:2px solid var(--line);background:#0f1430;color:var(--ink);text-decoration:none;cursor:pointer}
.acts .go{background:var(--gold);color:#0b0e1a;border-color:var(--gold);grid-column:1/-1;font-size:17px}
.acts .stamp[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#0b0e1a}
.quest{display:grid;gap:10px}
.quest article{border:2px solid var(--line);padding:10px 12px;background:#0f1430}
.quest h3{margin:0 0 4px;font-family:var(--dot);font-weight:400;font-size:17px;color:var(--pink)}
.quest p{margin:0 0 8px;font-size:14px;line-height:1.6}
.quest small{color:var(--sub)}
.quest button{font-family:var(--dot);font-size:15px;padding:8px 14px;background:var(--gold);color:#0b0e1a;border:0;cursor:pointer}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);z-index:1300;background:#0b0e1aee;border:2px solid var(--gold);color:var(--gold);font-family:var(--dot);font-size:17px;padding:10px 16px;white-space:nowrap;pointer-events:none}
.walkbar{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:1050;background:#0b0e1aee;border:2px solid var(--blue);color:var(--ink);font-family:var(--dot);font-size:15px;padding:8px 14px;white-space:nowrap}
.walkbar b{color:var(--blue);font-weight:400}
.stampbook{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.stampbook div{aspect-ratio:1;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--sub);text-align:center;padding:3px;line-height:1.2}
.stampbook div.on{border:2px solid var(--pink);color:var(--ink);background:radial-gradient(#ff5c9333,transparent 70%)}
.stampbook div b{font-family:var(--dot);font-size:18px;font-weight:400}
.rank{font-family:var(--dot);font-size:18px;color:var(--gold);margin:0 0 10px}
.note{font-size:12px;color:var(--sub);line-height:1.6;margin:12px 0 0}
#intro{position:fixed;inset:0;z-index:1400;background:#0b0e1af2;display:flex;align-items:center;justify-content:center;padding:20px}
#intro .box{max-width:380px;width:100%;border:3px solid var(--gold);background:var(--panel);padding:22px 20px;text-align:center}
#intro p{margin:0 0 10px;line-height:1.8}
#intro .big{font-family:var(--dot);font-size:26px;color:var(--pink);margin-bottom:12px;line-height:1.3}
#intro button{margin-top:10px;font-family:var(--dot);font-size:18px;padding:12px 22px;background:var(--gold);color:#0b0e1a;border:0;cursor:pointer;width:100%}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.hero.walk,.pin.secret,.blink{animation:none}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.maplibregl-ctrl-attrib{background:#0b0e1acc!important;color:#a6adcf!important;font-size:9px}
.maplibregl-ctrl-attrib a{color:#a6adcf!important}
.pin{cursor:pointer}
.lab{font-family:var(--dot);font-size:13px;color:#ffd27a;text-shadow:0 0 4px #0b0e1a,0 0 4px #0b0e1a,0 0 8px #0b0e1a;white-space:nowrap;pointer-events:none}
.me{width:20px;height:20px;border-radius:50%;background:#5ab0ff;border:3px solid #fff;box-shadow:0 0 0 8px #5ab0ff44}
.side{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;z-index:5;display:grid;gap:8px}
.side button{font-family:var(--dot);font-size:13px;color:var(--ink);background:#0b0e1aee;border:2px solid var(--line);padding:8px 10px;cursor:pointer;min-width:74px}
.side button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
</style>
</head>

<div id="intro"><div class="box">

  <p style="color:var(--sub);font-size:13px">どこかに隠しステージがあります</p>
  <button type="button" id="introOk">はじめる<span class="blink">▶</span></button>

let meM=null,watch=null;const bm=document.getElementById('b-me');
bm.onclick=()=>{
  if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null;bm.setAttribute('aria-pressed','false');if(meM){meM.m.remove();meM=null}return}
  if(!navigator.geolocation){toast('このスマホでは場所が取れません');return}
  bm.setAttribute('aria-pressed','true');let first=true;
  watch=navigator.geolocation.watchPosition(p=>{const c=[p.coords.longitude,p.coords.latitude];
    if(dist(c,HOME.center)>1500){if(first)toast('いまは下通の外です。着いたら地図に出ます',3200);first=false;return}
    if(!meM)meM=mk('<div class="me"></div>',c);else meM.m.setLngLat(c);
    if(first){map.easeTo({center:c,zoom:17.3,duration:700});first=false}
    if(!walking){let best=null;for(const k in pos){const d=dist(c,pos[k]);if(!best||d<best[0])best=[d,k]}
      if(best&&best[0]<120&&best[1]!==heroAt){heroAt=best[1];hero.m.setLngLat(pos[heroAt])}}
  },()=>{toast('場所を使う許可がありません',2600);bm.setAttribute('aria-pressed','false');watch=null},{enableHighAccuracy:true,maximumAge:5000})};
// コンパス
let comp=false,pend=null;const bc=document.getElementById('b-compass');
function onOri(e){let h=null;if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;else if(e.absolute&&e.alpha!=null)h=360-e.alpha;
  if(h===null||walking)return;pend=h;if(!onOri.q){onOri.q=true;requestAnimationFrame(()=>{onOri.q=false;map.setBearing(pend)})}}
bc.onclick=async()=>{
  if(comp){comp=false;window.removeEventListener('deviceorientationabsolute',onOri);window.removeEventListener('deviceorientation',onOri);bc.setAttribute('aria-pressed','false');map.easeTo({bearing:HOME.bearing,duration:500});return}
  try{if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted'){toast('向きを使う許可がありません',2600);return}
      window.addEventListener('deviceorientation',onOri)}
    else if('ondeviceorientationabsolute' in window)window.addEventListener('deviceorientationabsolute',onOri);
    else if(window.DeviceOrientationEvent)window.addEventListener('deviceorientation',onOri);
    else{toast('このスマホでは向きが取れません',2600);return}
    comp=true;bc.setAttribute('aria-pressed','true');toast('スマホの向きに地図が回ります')}catch(e){toast('向きが取れませんでした',2600)}};
document.getElementById('introOk').onclick=()=>document.getElementById('intro').remove();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
</script>
