*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--go);-webkit-tap-highlight-color:transparent;word-break:auto-phrase;line-break:strict}

.pin{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--dot);font-size:16px;color:#0b0e1a;border:3px solid #0b0e1a;box-shadow:0 0 0 2px #ffffff22,0 0 14px currentColor;position:relative}
.pin span{color:#0b0e1a}
.pin.done::after{content:"済";position:absolute;right:-10px;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#0b0e1a;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid #0b0e1a;font-family:var(--go);font-weight:700}
.pin.secret{animation:float 2.4s ease-in-out infinite}
.home{width:40px;height:40px;border-radius:8px;background:var(--ink);color:#0b0e1a;font-family:var(--dot);font-size:22px;display:flex;align-items:center;justify-content:center;border:3px solid #0b0e1a}
.home.en{background:var(--gold);font-size:17px}
.hero{width:44px;height:52px;filter:drop-shadow(0 0 6px #ffd27a)}
.hero.walk{animation:bob .28s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes float{50%{transform:translateY(-5px)}}
nav.tabs{display:flex;gap:6px;padding:8px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));background:#0b0e1a;border-top:2px solid var(--line);z-index:1000;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:none;font-family:var(--dot);font-size:14px;color:var(--ink);background:#141a33;border:2px solid var(--line);padding:7px 11px;border-radius:0;cursor:pointer}
nav.tabs button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
nav.tabs i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:0}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1100;background:var(--panel);border-top:3px solid var(--gold);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 30px #000a;max-height:72%;overflow:auto;transform:translateY(0);transition:transform .25s ease}
.sheet[hidden]{display:block!important;transform:translateY(110%)}
.sheet .close{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--sub);font-size:26px;cursor:pointer;line-height:1}
.kind{font-family:var(--dot);font-size:13px;letter-spacing:.06em}
.sheet h2{margin:2px 34px 4px 0;font-size:22px;line-height:1.3}
.fun{color:var(--gold);font-weight:700;margin:0 0 8px;font-size:15px}
.scores{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.scores span{font-size:13px;border:1px solid var(--line);padding:3px 8px;background:#0f1430}
.scores b{font-size:16px;color:var(--gold)}
dl{display:grid;grid-template-columns:5em 1fr;gap:4px 10px;margin:0 0 12px;font-size:14px}
dt{color:var(--sub)} dd{margin:0;min-width:0}
.tel{font-size:17px;font-weight:700;letter-spacing:.02em;user-select:all;white-space:nowrap}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts a,.acts button{font-family:var(--dot);font-size:15px;text-align:center;padding:11px 6px;border:2px solid var(--line);background:#0f1430;color:var(--ink);text-decoration:none;cursor:pointer}
.acts .go{background:var(--gold);color:#0b0e1a;border-color:var(--gold);grid-column:1/-1;font-size:17px}
.acts .stamp[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#0b0e1a}
.quest{display:grid;gap:10px}
.quest article{border:2px solid var(--line);padding:10px 12px;background:#0f1430}
.quest h3{margin:0 0 4px;font-family:var(--dot);font-weight:400;font-size:17px;color:var(--pink)}
.quest p{margin:0 0 8px;font-size:14px;line-height:1.6}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);z-index:1300;background:#0b0e1aee;border:2px solid var(--gold);color:var(--gold);font-family:var(--dot);font-size:17px;padding:10px 16px;white-space:nowrap;pointer-events:none}

function walkSeq(stops,done){
  if(walking)return;walking=true;closeSheet();
  let pts=[],total=0,from=heroAt;
  stops.forEach(t=>{const p=path(from,t);pts=pts.concat(pts.length?p.pts.slice(1):p.pts);total+=p.m;from=t});
  setLine('glow',pts);setLine('trail',[pts[0],pts[0]]);
  const b=new maplibregl.LngLatBounds(pts[0],pts[0]);pts.forEach(p=>b.extend(p));
  map.fitBounds(b,{padding:{top:90,bottom:110,left:50,right:90},pitch:map.getPitch(),bearing:map.getBearing(),duration:700,maxZoom:17.6});
  const seg=[];let acc=0;for(let i=1;i<pts.length;i++){const d=dist(pts[i],pts[i-1]);seg.push(d);acc+=d}
  const T=acc||1,speed=Math.max(45,T/7);
  const bar=document.getElementById('walkbar');bar.hidden=false;hero.el.innerHTML=heroSvg(true);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let t0=null;
  function step(ts){if(t0===null)t0=ts;
    const d=reduce?T:Math.min(T,(ts-t0)/1000*speed);let i=0,rem=d;while(i<seg.length&&rem>seg[i]){rem-=seg[i];i++}
    let p;if(i>=seg.length)p=pts[pts.length-1];else{const a=pts[i],c=pts[i+1],f=seg[i]?rem/seg[i]:0;p=[a[0]+(c[0]-a[0])*f,a[1]+(c[1]-a[1])*f]}
    hero.m.setLngLat(p);setLine('trail',pts.slice(0,i+1).concat([p]));
    const left=Math.round(total*(1-d/T));bar.innerHTML=`のこり <b>${left}m</b>　<span class="nb">歩いて${mins(left)}分</span>`;
    if(d<T)requestAnimationFrame(step);
    else{walking=false;heroAt=stops[stops.length-1];hero.el.innerHTML=heroSvg(false);bar.innerHTML=`とうちゃく！　<span class="nb">全部で<b>${total}m</b>・歩いて${mins(total)}分</span>`;setTimeout(()=>bar.hidden=true,3500);done&&done(total)}}
  requestAnimationFrame(step);
}

    if(!walking){let best=null;for(const k in pos){const d=dist(c,pos[k]);if(!best||d<best[0])best=[d,k]}
      if(best&&best[0]<120&&best[1]!==heroAt){heroAt=best[1];hero.m.setLngLat(pos[heroAt])}}
  },()=>{toast('場所を使う許可がありません',2600);bm.setAttribute('aria-pressed','false');watch=null},{enableHighAccuracy:true,maximumAge:5000})};
// コンパス
let comp=false,pend=null;const bc=document.getElementById('b-compass');
function onOri(e){let h=null;if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;else if(e.absolute&&e.alpha!=null)h=360-e.alpha;
  if(h===null||walking)return;pend=h;if(!onOri.q){onOri.q=true;requestAnimationFrame(()=>{onOri.q=false;map.setBearing(pend)})}}
bc.onclick=async()=>{
  if(comp){comp=false;window.removeEventListener('deviceorientationabsolute',onOri);window.removeEventListener('deviceorientation',onOri);bc.setAttribute('aria-pressed','false');map.easeTo({bearing:HOME.bearing,duration:500});return}
  try{if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted'){toast('向きを使う許可がありません',2600);return}
      window.addEventListener('deviceorientation',onOri)}
    else if('ondeviceorientationabsolute' in window)window.addEventListener('deviceorientationabsolute',onOri);
    else if(window.DeviceOrientationEvent)window.addEventListener('deviceorientation',onOri);
    else{toast('このスマホでは向きが取れません',2600);return}
    comp=true;bc.setAttribute('aria-pressed','true');toast('スマホの向きに地図が回ります')}catch(e){toast('向きが取れませんでした',2600)}};
document.getElementById('introOk').onclick=()=>document.getElementById('intro').remove();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
</script>
