<style>

 --dot:"DotGothic16","BIZ UDPGothic",sans-serif;--go:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--go);-webkit-tap-highlight-color:transparent;word-break:auto-phrase;line-break:strict}

h1{font-family:var(--dot);font-weight:400;font-size:21px;margin:0;line-height:1.1;letter-spacing:.04em;text-shadow:0 0 8px #ff5c9388}
h1 em{font-style:normal;color:var(--pink)}
.hud{margin-left:auto;display:flex;gap:6px;font-family:var(--dot);font-size:13px}
.hud span{border:2px solid var(--line);padding:3px 7px;background:#10152b;white-space:nowrap}
.hud b{color:var(--gold);font-weight:400}
#map{flex:1;background:#2c3458}
.leaflet-container{background:#2c3458;font-family:var(--go)}
.leaflet-control-attribution{background:#0b0e1acc!important;color:var(--sub)!important;font-size:9px}
.leaflet-control-attribution a{color:var(--sub)!important}
.leaflet-control-zoom a{background:#141a33!important;color:var(--ink)!important;border-color:var(--line)!important}
.pin{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--dot);font-size:16px;color:#0b0e1a;border:3px solid #0b0e1a;box-shadow:0 0 0 2px #ffffff22,0 0 14px currentColor;position:relative}
.pin span{color:#0b0e1a}
.pin.done::after{content:"済";position:absolute;right:-10px;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#0b0e1a;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid #0b0e1a;font-family:var(--go);font-weight:700}
.pin.secret{animation:float 2.4s ease-in-out infinite}
.home{width:40px;height:40px;border-radius:8px;background:var(--ink);color:#0b0e1a;font-family:var(--dot);font-size:22px;display:flex;align-items:center;justify-content:center;border:3px solid #0b0e1a}
.home.en{background:var(--gold);font-size:17px}
.hero{width:44px;height:52px;filter:drop-shadow(0 0 6px #ffd27a)}
.hero.walk{animation:bob .28s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes float{50%{transform:translateY(-5px)}}
nav.tabs{display:flex;gap:6px;padding:8px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));background:#0b0e1a;border-top:2px solid var(--line);z-index:1000;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:none;font-family:var(--dot);font-size:14px;color:var(--ink);background:#141a33;border:2px solid var(--line);padding:7px 11px;border-radius:0;cursor:pointer}
nav.tabs button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
nav.tabs i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:0}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1100;background:var(--panel);border-top:3px solid var(--gold);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 30px #000a;max-height:72%;overflow:auto;transform:translateY(0);transition:transform .25s ease}
.sheet[hidden]{display:block!important;transform:translateY(110%)}
.sheet .close{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--sub);font-size:26px;cursor:pointer;line-height:1}
.kind{font-family:var(--dot);font-size:13px;letter-spacing:.06em}
.sheet h2{margin:2px 34px 4px 0;font-size:22px;line-height:1.3}
.fun{color:var(--gold);font-weight:700;margin:0 0 8px;font-size:15px}
.scores{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}

.quest{display:grid;gap:10px}
.quest article{border:2px solid var(--line);padding:10px 12px;background:#0f1430}

.note{font-size:12px;color:var(--sub);line-height:1.6;margin:12px 0 0}

const heroIcon=w=>L.divIcon({className:'',html:heroSvg.replace('class="hero"',w?'class="hero walk"':'class="hero"'),iconSize:[44,52],iconAnchor:[22,48]});
let heroAt='aoyagi';

function walkSeq(stops,done){
  if(walking)return;walking=true;closeSheet();
  let pts=[],total=0,from=heroAt;
  stops.forEach(t=>{const p=path(from,t);pts=pts.concat(pts.length?p.pts.slice(1):p.pts);total+=p.m;from=t});
  if(trail)map.removeLayer(trail);if(glow)map.removeLayer(glow);
  const lls=pts.map(p=>ll(p[0],p[1]));
  glow=L.polyline(lls,{color:'#5ab0ff',weight:12,opacity:.25,interactive:false}).addTo(map);
  trail=L.polyline([lls[0]],{color:'#ffd27a',weight:5,dashArray:'2 9',lineCap:'round',interactive:false}).addTo(map);
  map.flyToBounds(glow.getBounds().pad(.25),{duration:.6,maxZoom:.5});
  const seg=[];let acc=0;for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);acc+=d}
  const pxTotal=acc||1,speed=Math.max(160,pxTotal/7);
  const bar=document.getElementById('walkbar');bar.hidden=false;
  hero.setIcon(heroIcon(true));
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t0=null;
  function step(ts){
    if(t0===null)t0=ts;
    let d=reduce?pxTotal:Math.min(pxTotal,(ts-t0)/1000*speed);
    let i=0,rem=d;while(i<seg.length&&rem>seg[i]){rem-=seg[i];i++}
    let p;if(i>=seg.length)p=pts[pts.length-1];else{const a=pts[i],b=pts[i+1],f=seg[i]?rem/seg[i]:0;p=[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]}
    hero.setLatLng(ll(p[0],p[1]));
    trail.setLatLngs(lls.slice(0,i+1).concat([ll(p[0],p[1])]));
    const left=Math.round(total*(1-d/pxTotal));
    bar.innerHTML=`のこり <b>${left}m</b>　<span class="nb">歩いて${mins(left)}分</span>`;
    if(d<pxTotal)requestAnimationFrame(step);
    else{walking=false;heroAt=stops[stops.length-1];hero.setIcon(heroIcon(false));bar.innerHTML=`とうちゃく！　<span class="nb">全部で<b>${total}m</b>・歩いて${mins(total)}分</span>`;setTimeout(()=>bar.hidden=true,3500);done&&done(total)}
  }
  requestAnimationFrame(step);
}

    <dl>
      <dt>どんな店</dt><dd>${s.type}</dd>
      <dt>土曜の時間</dt><dd>${s.hours}</dd>
      <dt>いまから</dt><dd><span class="nb">${nameOf(heroAt)}から ${p.m}m・</span><span class="nb">歩いて${mins(p.m)}分</span></dd>
      <dt>場所</dt><dd>${s.addr}</dd>
      ${s.tel?`<dt>電話</dt><dd><span class="tel">${s.tel}</span></dd>`:''}
    </dl>
    <div class="acts">
      <button type="button" class="go" id="goBtn">ここへ歩く ▶</button>
      <button type="button" class="stamp" id="stampBtn" aria-pressed="${stamped}">${stamped?'スタンプ済み':'スタンプを押す'}</button>
      <a href="https://www.google.com/maps/dir/?api=1&destination=${q}&travelmode=walking" target="_blank" rel="noopener">Googleマップ</a>
    </div>
    ${s.id==='6'?'<p class="note">口コミに「高いコースに案内された」「1人だと断られた」という声があります。入る前に料金を聞いてください。</p>':''}
    ${s.cat==='girl'||s.cat==='secret'?'':''}`);
  document.getElementById('goBtn').onclick=()=>{if(heroAt===s.id){toast('もう着いています');return}walkSeq([s.id],()=>toast(s.name+' に着いた！'))};
  document.getElementById('stampBtn').onclick=e=>{
    if(store.stamps[s.id]){delete store.stamps[s.id]}else{store.stamps[s.id]=1;toast('スタンプゲット！ '+s.name)}
    save();refreshPin(s);updHud();
    e.currentTarget.setAttribute('aria-pressed',!!store.stamps[s.id]);e.currentTarget.textContent=store.stamps[s.id]?'スタンプ済み':'スタンプを押す';
  };
}
function updHud(){document.getElementById('stampN').textContent=Object.keys(store.stamps).length}
updHud();

// filters
document.querySelectorAll('nav.tabs [data-f]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav.tabs [data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  const f=b.dataset.f;
  DATA.shops.forEach(s=>{const show=f==='all'||s.cat===f||(s.cat==='secret'&&f==='girl');const m=markers[s.id];if(show)m.addTo(map);else map.removeLayer(m)});
});

// quests
const QUESTS=[
 {n:'クエスト1　王道',d:'青柳 → 6 Club Splash → 19 龍の家で締め → ホテル',s:['6','19','hotel'],m:'全部ホテルのすぐそば。迷いません'},
 {n:'クエスト2　しっとり大人',d:'青柳 → 3 Bar shage → 1 Glass Wonder → 17 桂花で締め → ホテル',s:['3','1','17','hotel'],m:'バーをはしごして熊本ラーメン'},
 {n:'クエスト3　朝まで',d:'青柳 → 8 water lounge ame → 2 Azzurro → 21 烈火 → ホテル',s:['8','2','21','hotel'],m:'Azzurroは朝6時、烈火は3時まで。次の日は9:40チェックアウト'},
 {n:'クエスト4　馬づくし',d:'青柳 → 16 馬か家 んま → 18 黒亭 → ホテル',s:['16','18','hotel'],m:'宴会で足りなかった人の馬肉とラーメン'},
];
document.getElementById('b-quest').onclick=()=>{
  openSheet(`<div class="kind" style="color:var(--gold)">QUEST</div><h2>今夜のクエストをえらぶ</h2><div class="quest">${QUESTS.map((q,i)=>{
    let m=0,f='aoyagi';q.s.forEach(t=>{m+=path(f,t).m;f=t});
    return `<article><h3>${q.n}</h3><p>${q.d.split(' → ').map(x=>'<span class="nb">'+x+'</span>').join(' → ')}</p><p><small>${q.m}　<span class="nb">全部で${m}m・歩いて${mins(m)}分</span></small></p><button type="button" data-q="${i}">青柳からスタート ▶</button></article>`}).join('')}</div>`);
  body.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{
    const q=QUESTS[+b.dataset.q];heroAt='aoyagi';hero.setLatLng(ll(...pos.aoyagi));
    walkSeq(q.s,t=>toast('クエストクリア！ '+t+'m 歩いた',2600));
  });
};

// stamp book
const RANKS=[[0,'見習い'],[1,'夜の旅人'],[3,'下通の常連'],[6,'中央街の顔'],[10,'熊本の夜の王'],[15,'伝説の勇者']];
document.getElementById('b-book').onclick=()=>{
  const n=Object.keys(store.stamps).length;let r=RANKS[0][1];RANKS.forEach(([k,v])=>{if(n>=k)r=v});
  openSheet(`<div class="kind" style="color:var(--pink)">STAMP BOOK</div><h2>スタンプ帳</h2><p class="rank">いまの称号：${r}（${n}/22）</p><div class="stampbook">${DATA.shops.map(s=>{
    const on=store.stamps[s.id];const hide=s.cat==='secret'&&!store.found;
    return `<div class="${on?'on':''}"><b style="color:${CAT[s.cat].h}">${hide?'？':s.id}</b>${hide?'？？？':s.name}</div>`}).join('')}</div>
    <p class="note">スタンプはこのスマホの中にだけ残ります。<br>★はGoogleマップ、点数は食べログ（どちらも11月10日に見たもの）。時間は土曜日の営業時間です。行く前にお店に確かめてください。</p>
    <button type="button" id="resetBtn" style="margin-top:10px;font-family:var(--dot);background:none;border:1px solid var(--line);color:var(--sub);padding:6px 10px">スタンプを全部消す</button>`);
  const rb=document.getElementById('resetBtn');let armed=false;
  rb.onclick=()=>{if(!armed){armed=true;rb.textContent='もう一度押すと消えます';return}store.stamps={};save();DATA.shops.forEach(refreshPin);updHud();document.getElementById('b-book').onclick()};
};

document.getElementById('introOk').onclick=()=>{document.getElementById('intro').remove()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
</script>
</body>
</html>
