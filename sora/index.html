<!doctype html>
<html lang="ja">
<head>

<title>空から見る2日間｜卒業旅行 in 熊本</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap">

<style>
:root{--ink:#f4efe4;--sub:#cfc8b8;--gold:#e0b565;--night:#10151c;--line:#ffffff33;--d1:#e0b565;--d2:#7fc4e8;
 --mincho:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;--gothic:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--gothic);-webkit-tap-highlight-color:transparent;word-break:auto-phrase;line-break:strict;overflow:hidden}
.nb{display:inline-block}
#map{position:fixed;inset:0}
.shade{position:fixed;left:0;right:0;pointer-events:none;z-index:2}
.shade.t{top:0;height:110px;background:linear-gradient(#0b1016cc,#0b101600)}
.shade.b{bottom:0;height:300px;background:linear-gradient(#0b101600,#0b1016e6 62%)}
header{position:fixed;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 0}
header a{color:var(--ink);text-decoration:none;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:#0b101699;min-height:36px;display:flex;align-items:center}
header h1{font-family:var(--mincho);font-weight:700;font-size:16px;margin:0;letter-spacing:.08em;text-shadow:0 1px 6px #000}
.card{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:0 16px calc(14px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.day{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.12em;padding:4px 10px;border-radius:3px;color:#10151c;background:var(--d1)}
.day.d2{background:var(--d2)}
.time{font-family:var(--mincho);font-weight:700;font-size:15px;margin-left:10px;color:var(--sub);font-variant-numeric:tabular-nums}
.name{font-family:var(--mincho);font-weight:900;font-size:clamp(24px,7vw,34px);line-height:1.25;margin:8px 0 4px;text-shadow:0 2px 10px #000}
.note{margin:0;font-size:14px;line-height:1.7;color:var(--sub);min-height:3.4em}
.txt{transition:opacity .45s,transform .45s}
.txt.out{opacity:0;transform:translateY(8px)}
.bar{display:flex;align-items:center;gap:8px;margin-top:10px}
.bar button{font:inherit;color:var(--ink);background:#0b1016b3;border:1px solid var(--line);border-radius:999px;min-width:48px;height:48px;padding:0 14px;font-size:15px;cursor:pointer}
.bar button#play{background:var(--gold);color:#10151c;border-color:var(--gold);font-weight:700;min-width:104px}
.bar button:focus-visible,header a:focus-visible,.chips button:focus-visible,#go:focus-visible{outline:3px solid #fff;outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;font:inherit;font-size:12.5px;color:var(--sub);background:#0b1016b3;border:1px solid var(--line);border-radius:999px;padding:8px 12px;min-height:36px;cursor:pointer;white-space:nowrap}
.chips button.on{color:#10151c;background:var(--ink);border-color:var(--ink);font-weight:700}
.chips .sep{flex:none;align-self:center;font-size:11px;color:var(--gold);font-weight:700;padding:0 2px 0 6px;letter-spacing:.1em}
.pin{display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
.pin b{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:#10151c;background:var(--d1);border:2px solid #10151c;box-shadow:0 0 0 2px #fff}
.pin.d2 b{background:var(--d2)}
.pin span{font-size:11.5px;font-weight:700;color:#fff;background:#10151ccc;border-radius:3px;padding:2px 6px;white-space:nowrap;opacity:0;transition:opacity .4s}
.pin.on span{opacity:1}
.pin.on b{transform:scale(1.25);box-shadow:0 0 0 2px #fff,0 0 18px 6px #ffffffaa}
#veil{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:#0b1016;opacity:0;pointer-events:none;transition:opacity .5s}
#veil.on{opacity:1}
#veil small{color:var(--gold);font-size:13px;font-weight:700;letter-spacing:.2em}
#veil b{font-family:var(--mincho);font-weight:900;font-size:clamp(24px,7vw,34px);line-height:1.35}
#veil i{font-style:normal;color:var(--sub);font-size:13px}
#intro{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#0b1016d9;padding:24px;text-align:center}
#intro>div{max-width:440px}
#intro small{display:block;color:var(--gold);letter-spacing:.2em;font-size:12px;font-weight:700}
#intro h2{font-family:var(--mincho);font-weight:900;font-size:clamp(30px,9vw,44px);margin:10px 0 12px;line-height:1.3}
#intro p{color:var(--sub);font-size:14px;line-height:1.8;margin:0 0 22px}
#go{font:inherit;font-weight:700;font-size:17px;color:#10151c;background:var(--gold);border:0;border-radius:999px;padding:15px 34px;min-height:52px;cursor:pointer}
#intro[hidden]{display:none}
.maplibregl-ctrl-attrib{font-size:9px;background:#0b1016aa!important;color:#cfc8b8!important}
.maplibregl-ctrl-attrib a{color:#cfc8b8!important}
.maplibregl-ctrl-bottom-right{bottom:auto;top:calc(52px + env(safe-area-inset-top))}
#dbg{position:fixed;z-index:30;top:60px;left:8px;background:#000c;color:#0f0;font:12px monospace;padding:6px;white-space:pre}
#cross{position:fixed;z-index:30;left:50%;top:50%;width:20px;height:20px;margin:-10px;border:2px solid #f0f;border-radius:50%;pointer-events:none}
.rec header,.rec .card,.rec .shade,.rec #intro,.rec #veil,.rec .maplibregl-ctrl-bottom-right,.rec .pin{display:none!important}
.rec #map{inset:auto;left:0;top:0;width:720px;height:1280px}
.vid #map,.vid .shade,.vid .card,.vid #intro,.vid #veil,.vid .maplibregl-ctrl-bottom-right{display:none!important}
.vid header{position:static;padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
html.vid,html.vid body{overflow:auto;height:auto;min-height:100%}
#vbox{display:none}
.vid #vbox{display:block;max-width:760px;margin:0 auto;padding:0 0 calc(24px + env(safe-area-inset-bottom))}
#vbox video{display:block;width:100%;height:auto;max-height:calc(100vh - 150px);max-height:calc(100dvh - 150px);background:#000;object-fit:contain}
@media (orientation:landscape) and (max-height:520px){.vid #vbox{max-width:none}#vbox video{max-height:calc(100vh - 58px);max-height:calc(100dvh - 58px)}}
.vid header{flex-wrap:wrap}.vid header h1{min-width:0;overflow-wrap:anywhere}#vbox .nb{display:inline}#vbox p,#vbox a.alt{overflow-wrap:anywhere;max-width:calc(100% - 32px);box-sizing:border-box}
#vbox p{margin:14px 16px 0;font-size:13.5px;line-height:1.8;color:var(--sub)}
#vbox a.alt{display:inline-flex;align-items:center;min-height:44px;margin:10px 16px 0;padding:8px 16px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;font-size:14px}
@media (prefers-reduced-motion:reduce){.txt{transition:none}.pin span,.pin b{transition:none}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="熊本の空からの地図"></div>
<div class="shade t"></div><div class="shade b"></div>
<header><a href="../">しおりにもどる</a><h1>空から見る2日間</h1></header>
<div id="vbox">
  <video controls playsinline preload="metadata" poster="sora-ai-hyoshi.jpg?v=9" src="sora-ai.mp4?v=9"></video>
  <p><span class="nb">しおりの行程を、</span><span class="nb">空から順にたどる動画です（2分23秒）。</span><span class="nb">音楽が流れます。</span></p>
  <a class="alt" href="?map">地図を指で動かして見る</a>
</div>
<div id="veil" aria-hidden="true"><small id="v1"></small><b id="v2"></b><i>空から近づいています</i></div>
<div id="intro"><div>
  <small>卒業旅行 in 熊本</small>
  <h2><span class="nb">空から見る</span><span class="nb">2日間</span></h2>
  <p><span class="nb">しおりの行程を、</span><span class="nb">空から順にたどります。</span><br><span class="nb">2分半ほどです。</span><span class="nb">とちゅうで止めて、</span><span class="nb">指で見回すこともできます。</span></p>
  <button id="go" type="button">飛びはじめる</button>
</div></div>
<section class="card" aria-live="polite">
  <div class="txt" id="txt"><span class="day" id="day">1日目</span><span class="time" id="time"></span>
  <h2 class="name" id="name">熊本へ</h2><p class="note" id="note"></p></div>
  <div class="bar"><button id="prev" type="button" aria-label="前の場所へ">◀</button><button id="play" type="button">止める</button><button id="next" type="button" aria-label="次の場所へ">▶</button></div>
  <div class="chips" id="chips"></div>
</section>
<script>
// 携帯では、先に録った動画を見せる（地図を動かすと、機種や回線で粗く見えるため）。?map を付けると地図になる
(function(){var q=new URLSearchParams(location.search);
 window.__VIDEO=!q.has('map')&&!q.has('rec')&&!q.has('edit')&&!q.has('cut')&&!q.has('fly')&&matchMedia('(max-width:820px),(pointer:coarse)').matches;
 if(window.__VIDEO)document.documentElement.classList.add('vid')})();
</script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
if(!window.__VIDEO){
// 行程（しおりと同じ順番）。ll=[東経,北緯]  z=近さ  b=向き  o=ぐるっと回る角度
const S=[
 {d:1,t:'8:45',n:'熊本空港に着く',m:'小牧から1時間半。阿蘇のふもとの空港に降ります。',ll:[130.8553,32.8373],z:13.4,b:60,o:50},
 {d:1,t:'10:00ごろ',n:'熊本地震震災ミュージアム KIOKU',m:'地表に出た断層と、壊れた大学の校舎が、そのまま残してあります。',ll:[130.997081,32.890344],z:15.4,b:200,o:90},
 {d:1,t:'時間があれば',n:'新阿蘇大橋展望所 ヨ・ミュール',m:'深い谷にかかる大きな橋を、すぐ横からながめます。',ll:[130.9861,32.8781],z:15.4,b:60,o:150},
 {d:1,t:'12:00',n:'お昼　フェデリコ ヌーボ',m:'上通にあるイタリア料理の店です。',ll:[130.7106,32.8058],z:16.3,b:-30,o:60},
 {d:1,t:'14:00',n:'熊本城',m:'天守閣は最上階まで上がれます。晴れていれば、阿蘇の山まで見えます。',ll:[130.7059,32.8062],z:16.0,b:40,o:300},
 {d:1,t:'15:30',n:'ホテルに入る',m:'熊本ワシントンホテルプラザ。宴会までは自由時間です。',ll:[130.7087409,32.7985971],z:16.6,b:-20,o:50},
 {d:1,t:'18:30',n:'宴会　熊本郷土料理 青柳',m:'ホテルから歩いて7分。ここで、何かが起こります。',ll:[130.708361,32.8021007],z:16.8,b:150,o:90},
 {d:2,t:'10:00',n:'熊本駅',m:'10時21分発の特急「A列車で行こう」に乗ります。',ll:[130.6890,32.7902],z:15.6,b:200,o:60},
 {d:2,t:'11:30',n:'三角駅に着く',m:'有明海ぞいを走って、線路の終点へ。ここからは貸切バスです。',ll:[130.4697,32.6085],z:15.2,b:250,o:70,rail:[[130.6800,32.7600],[130.6640,32.7200],[130.6589,32.6906],[130.6400,32.6985],[130.6040,32.7003],[130.5813,32.6933],[130.5587,32.6812],[130.5417,32.6671],[130.5246,32.6614],[130.5020,32.6502],[130.4850,32.6407],[130.4760,32.6230]]},
 {d:2,t:'12:00',n:'お昼　mio camino AMAKUSA',m:'天草の4号橋のたもとで、海を見ながらバーベキューです。',ll:[130.4256,32.5267],z:15.2,b:200,o:120},
 {d:2,t:'14:50',n:'三角西港',m:'明治20年にできた港。石積みの岸壁がそのまま残る、世界遺産です。',ll:[130.4558,32.62186],z:15.8,b:30,o:110},
 {d:2,t:'16:30',n:'道の駅「不知火」',m:'デコポンが生まれた土地。物産館は17時までです。',ll:[130.6285,32.6337],z:15.2,b:-20,o:70},
 {d:2,t:'18:00',n:'熊本空港',m:'夕ごはんはそれぞれで。20時の飛行機で、小牧へ帰ります。',ll:[130.8553,32.8373],z:13.2,b:250,o:70}
];
const Q=new URLSearchParams(location.search),DBG=Q.has('edit');
// 携帯：飛びながらだと写真が間に合わずぼやけるので、場所ごとに写真がそろってから見せる
const REC=Q.has('rec');if(REC)document.documentElement.classList.add('rec');let LOG=()=>{};
const CUT=Q.has('cut');
const FINE=Q.has('fine');
// 国土地理院の標高タイルを、地図の部品が読める形に直す（海は0mにする）
maplibregl.addProtocol('gsidem',async(params,ac)=>{
  const mk=()=>{if(typeof OffscreenCanvas!=='undefined')return new OffscreenCanvas(256,256);const c=document.createElement('canvas');c.width=c.height=256;return c};
  const out=async c=>{const b=c.convertToBlob?await c.convertToBlob({type:'image/png'}):await new Promise(r=>c.toBlob(r,'image/png'));return{data:await b.arrayBuffer()}};
  const c=mk(),x=c.getContext('2d',{willReadFrequently:true});
  let img=null;
  try{const r=await fetch(params.url.replace('gsidem://','https://'),{signal:ac.signal});if(r.ok)img=await createImageBitmap(await r.blob(),{colorSpaceConversion:'none',premultiplyAlpha:'none'})}catch(e){if(e.name==='AbortError')throw e}
  if(!img){x.fillStyle='rgb(128,0,0)';x.fillRect(0,0,256,256);return out(c)}
  x.drawImage(img,0,0);const d=x.getImageData(0,0,256,256),p=d.data;
  for(let i=0;i<p.length;i+=4){let v=p[i]*65536+p[i+1]*256+p[i+2];let h=(v===8388608||p[i+3]===0)?0:(v>8388608?(v-16777216)*0.01:v*0.01);if(h<0)h=0;
    const t=h+32768;p[i]=Math.floor(t/256);p[i+1]=Math.floor(t)%256;p[i+2]=Math.floor((t-Math.floor(t))*256);p[i+3]=255}
  x.putImageData(d,0,0);return out(c)});
const first=S[0];
const map=new maplibregl.Map({container:'map',center:[130.72,32.74],zoom:8.6,pitch:35,bearing:20,maxPitch:78,minZoom:7,maxZoom:17.5,attributionControl:false,pixelRatio:REC?1.5:undefined,
 style:{version:8,
  sources:{photo:{type:'raster',tiles:['https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg'],tileSize:FINE?128:256,minzoom:2,maxzoom:18,attribution:'写真・地図・標高：国土地理院'},
   dem:{type:'raster-dem',tiles:['gsidem://cyberjapandata.gsi.go.jp/xyz/dem_png/{z}/{x}/{y}.png'],tileSize:256,minzoom:1,maxzoom:14,encoding:'terrarium'},
   v:{type:'vector',tiles:['https://cyberjapandata.gsi.go.jp/xyz/experimental_bvmap/{z}/{x}/{y}.pbf'],minzoom:4,maxzoom:16}},
  layers:[{id:'bg',type:'background',paint:{'background-color':'#1f3f63'}},
   {id:'photo',type:'raster',source:'photo',paint:{'raster-saturation':0.12,'raster-contrast':0.06,'raster-fade-duration':200}},
   {id:'bld',type:'fill-extrusion',source:'v','source-layer':'building',minzoom:14.5,paint:{'fill-extrusion-color':'#e4dccb','fill-extrusion-height':['match',['get','ftCode'],3112,26,3103,22,9],'fill-extrusion-opacity':0.58}}]}});
map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-right');
map.on('error',()=>{});
const line=S.flatMap((s,i)=>[...(s.rail||[]),s.ll]);
const pins=S.map((s,i)=>{const el=document.createElement('div');el.className='pin'+(s.d===2?' d2':'');el.innerHTML=`<b>${i+1}</b><span>${s.n.replace(/^(お昼|宴会)　/,'')}</span>`;new maplibregl.Marker({element:el,anchor:'top',offset:[0,-13]}).setLngLat(s.ll).addTo(map);return el});
map.on('load',()=>{
  try{map.setTerrain({source:'dem',exaggeration:1.25})}catch(e){}
  try{map.setSky&&map.setSky({'sky-color':'#7fb4e6','horizon-color':'#f3e3c4','fog-color':'#e9e4d8','fog-ground-blend':0.55,'horizon-fog-blend':0.6,'sky-horizon-blend':0.7,'atmosphere-blend':0.6})}catch(e){}
  map.addSource('route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:line}}});
  map.addLayer({id:'route-c',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#10151c','line-width':6,'line-opacity':0.55}});
  map.addLayer({id:'route',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#ffe9b8','line-width':3,'line-dasharray':[1,1.6]}});
  if(REC){ // 録画のときは、印も地図の中に描く（画面の部品は動画に入らないため）
    S.forEach((s,i)=>{const c=document.createElement('canvas');c.width=c.height=72;const x=c.getContext('2d');
      x.beginPath();x.arc(36,36,31,0,7);x.fillStyle='#fff';x.fill();x.beginPath();x.arc(36,36,27,0,7);x.fillStyle='#10151c';x.fill();x.beginPath();x.arc(36,36,23,0,7);x.fillStyle=s.d===2?'#7fc4e8':'#e0b565';x.fill();
      x.fillStyle='#10151c';x.font='bold 28px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(String(i+1),36,38);map.addImage('p'+i,x.getImageData(0,0,72,72),{pixelRatio:2})});
    map.addSource('pins',{type:'geojson',data:{type:'FeatureCollection',features:S.map((s,i)=>({type:'Feature',properties:{icon:'p'+i},geometry:{type:'Point',coordinates:s.ll}}))}});
    map.addLayer({id:'pins',type:'symbol',source:'pins',layout:{'icon-image':['get','icon'],'icon-allow-overlap':true,'icon-ignore-placement':true}})}
});
// ---- 飛ぶ
const $=id=>document.getElementById(id);let cur=-1,tok=0,playing=false;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const wait=(ms,k)=>new Promise(r=>setTimeout(()=>r(k===tok),ms));
const move=(fn,opt,k)=>new Promise(r=>{if(k!==tok)return r(false);map.once('moveend',()=>r(k===tok));map[fn](Object.assign({essential:true},opt))});
const km=(a,b)=>{const R=6371,f=Math.PI/180,x=(b[0]-a[0])*f*Math.cos((a[1]+b[1])/2*f),y=(b[1]-a[1])*f;return Math.hypot(x,y)*R};
const brg=(a,b)=>{const f=Math.PI/180;return Math.atan2((b[0]-a[0])*Math.cos(a[1]*f),b[1]-a[1])/f};
function show(i){LOG('s'+i);const s=S[i];const t=$('txt');t.classList.add('out');setTimeout(()=>{$('day').textContent=s.d+'日目';$('day').className='day'+(s.d===2?' d2':'');$('time').textContent=s.t;$('name').textContent=s.n;$('note').textContent=s.m;t.classList.remove('out')},reduce?0:260);
  pins.forEach((p,j)=>p.classList.toggle('on',j===i));[...$('chips').querySelectorAll('button')].forEach((b,j)=>{b.classList.toggle('on',j===i);if(j===i)b.scrollIntoView({behavior:reduce?'auto':'smooth',inline:'center',block:'nearest'})})}
const veil=(on,s)=>{if(s){$('v1').textContent=s.d+'日目　'+s.t;$('v2').textContent=s.n}$('veil').classList.toggle('on',on)};
const ready=(ms,k)=>Promise.race([new Promise(r=>map.once('idle',r)),wait(ms,k)]).then(()=>k===tok);
async function cutTo(i,k){const s=S[i];
  veil(true,s);if(!await wait(560,k))return false;
  if(s.rail){const a=s.rail[5],b=s.rail[7];$('v2').textContent='特急「A列車で行こう」';$('v1').textContent='2日目　10:21 熊本駅発';
    map.jumpTo({center:a,zoom:13.6,pitch:58,bearing:brg(a,b)+20});
    $('day').textContent='2日目';$('day').className='day d2';$('time').textContent='10:21 熊本駅発';$('name').textContent='特急「A列車で行こう」';$('note').textContent='黒と金の車両で、有明海ぞいを三角へ。';
    if(!await ready(6500,k))return false;veil(false);
    if(!await move('easeTo',{center:b,bearing:brg(a,b)-10,duration:7500,easing:t=>t},k))return false;
    veil(true,s);if(!await wait(560,k))return false}
  map.jumpTo({center:s.ll,zoom:s.z-0.2,pitch:58,bearing:s.b-6});show(i);
  if(!await ready(7000,k))return false;veil(false);
  if(!await move('easeTo',{bearing:s.b+s.o,zoom:s.z,pitch:60,duration:Math.max(7000,s.o*58),easing:t=>t},k))return false;
  return wait(300,k)}
async function goTo(i,k,fly){const s=S[i];cur=i;
  if(reduce||!fly){veil(false);show(i);map.jumpTo({center:s.ll,zoom:s.z,pitch:62,bearing:s.b});return k===tok}
  if(CUT)return cutTo(i,k);
  const from=map.getCenter().toArray();
  if(s.rail){LOG('rail');$('name').textContent='特急「A列車で行こう」';$('time').textContent='10:21 熊本駅発';$('note').textContent='黒と金の車両で、有明海ぞいを三角へ。';
    const pts=[...s.rail,s.ll];let p=from;
    if(!await move('easeTo',{center:pts[0],zoom:12.6,pitch:64,bearing:brg(p,pts[0]),duration:2600},k))return false;p=pts[0];
    for(let j=1;j<pts.length;j++){if(!await move('easeTo',{center:pts[j],zoom:12.9,pitch:66,bearing:brg(p,pts[j])+(j%2?12:-12),duration:Math.max(1300,km(p,pts[j])*330),easing:t=>t},k))return false;p=pts[j]}
    show(i);if(!await move('easeTo',{center:s.ll,zoom:s.z,pitch:62,bearing:s.b,duration:2600},k))return false}
  else{const dist=km(from,s.ll);show(i);
    if(!await move('flyTo',{center:s.ll,zoom:s.z,pitch:62,bearing:s.b,duration:Math.min(9000,Math.max(3200,2600+dist*260)),curve:dist>6?1.25:0.9},k))return false}
  // 着いたら、写真がはっきりするのを少し待ってから、ゆっくり回る
  await Promise.race([new Promise(r=>map.once('idle',r)),wait(1800,k)]);if(k!==tok)return false;
  if(!await move('easeTo',{bearing:s.b+s.o,pitch:66,duration:Math.max(5600,s.o*42),easing:t=>t},k))return false;
  return wait(400,k)}
async function run(from){const k=++tok;playing=true;$('play').textContent='止める';
  for(let i=from;i<S.length;i++){if(!await goTo(i,k,true))return}
  if(k===tok){playing=false;$('play').textContent='もう一度';cur=-1;show(S.length-1);map.flyTo({center:[130.66,32.72],zoom:8.9,pitch:40,bearing:15,duration:5000,essential:true})}}
function stop(){tok++;playing=false;map.stop();veil(false);$('play').textContent='つづきから'}
$('play').onclick=()=>{if(playing)stop();else run(cur<0?0:cur)};
$('next').onclick=()=>{const i=Math.min(S.length-1,(cur<0?-1:cur)+1);stop();const k=tok;goTo(i,k,true)};
$('prev').onclick=()=>{const i=Math.max(0,(cur<0?0:cur)-1);stop();const k=tok;goTo(i,k,true)};
S.forEach((s,i)=>{if(i===0||S[i-1].d!==s.d){const e=document.createElement('span');e.className='sep';e.textContent=s.d+'日目';$('chips').appendChild(e)}
  const b=document.createElement('button');b.type='button';b.textContent=(i+1)+' '+s.n.replace(/^(お昼|宴会)　/,'').replace(/に着く$/,'');b.onclick=()=>{stop();const k=tok;goTo(i,k,true)};$('chips').appendChild(b)});
['dragstart','wheel','touchstart'].forEach(e=>map.on(e,ev=>{if(playing&&ev.originalEvent)stop()}));
$('go').onclick=()=>{$('intro').hidden=true;if(reduce){cur=0;goTo(0,tok,false);$('play').textContent='次へ進む';$('play').onclick=()=>$('next').onclick()}else run(0)};
// ---- 録画（?rec のときだけ）。rec(false)=下見で写真を先に読ませる　rec(true)=録る
if(REC){window.__state='ready';window.__rec=async(doRec)=>{const cv=map.getCanvas();let mr,chunks=[];window.__log=[];window.__state=doRec?'recording':'warming';
  map.jumpTo({center:[130.72,32.74],zoom:8.6,pitch:35,bearing:20});await new Promise(r=>map.once('idle',r));
  if(doRec){mr=new MediaRecorder(cv.captureStream(30),{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:16000000});mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};mr.start(1000)}
  const t0=performance.now();LOG=x=>window.__log.push([x,+((performance.now()-t0)/1000).toFixed(2)]);LOG('start');
  await move('easeTo',{bearing:32,zoom:8.8,duration:2600,easing:t=>t},tok);
  const k=++tok;playing=true;for(let i=0;i<S.length;i++){if(!await goTo(i,k,true))break}
  LOG('end');await move('flyTo',{center:[130.66,32.72],zoom:8.9,pitch:40,bearing:15,duration:5500},tok);await wait(1500,tok);LOG('stop');playing=false;
  if(doRec){await new Promise(r=>{mr.onstop=r;mr.stop()});const b=new Blob(chunks,{type:'video/webm'});window.__size=b.size;window.__blob=b;
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kumamoto-sora-rokuga.webm';document.body.appendChild(a);a.click()}
  window.__state='done'}}
// ---- 1コマずつ録る（画面が消えていても同じ速さで録れる）。?rec のときだけ
if(REC){
  const M=([x,y])=>[x,Math.log(Math.tan(Math.PI/4+y*Math.PI/360))*180/Math.PI],U=([x,y])=>[x,(Math.atan(Math.exp(y*Math.PI/180))*2-Math.PI/2)*180/Math.PI];
  const ez=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lerp=(a,b,t)=>a+(b-a)*t,ang=(a,b,t)=>a+(((b-a)%360+540)%360-180)*t;
  // 場面の並び：[種類, 長さ(秒), ...]
  const OV={c:[130.72,32.74],z:8.6,p:35,b:20},SEG=[];let t=0,pv={c:OV.c,z:8.8,p:35,b:34};const CAP=[];
  SEG.push({k:'pan',t0:0,d:3.2,a:OV,b:pv});t=3.2;
  S.forEach((s,i)=>{const to={c:s.ll,z:s.z,p:62,b:s.b};
    if(s.rail){const pts=[pv.c,...s.rail,s.ll].map(M),len=[0];for(let j=1;j<pts.length;j++)len.push(len[j-1]+Math.hypot(pts[j][0]-pts[j-1][0],pts[j][1]-pts[j-1][1]));
      CAP.push(['rail',t]);SEG.push({k:'rail',t0:t,d:20,pts,len,a:pv,b:to});t+=20;CAP.push(['s'+i,t-2.4])}
    else{const dist=km(pv.c,s.ll),d=Math.min(8.5,Math.max(3.4,2.8+dist*0.24));CAP.push(['s'+i,t+0.3]);SEG.push({k:'fly',t0:t,d,a:pv,b:to,hop:Math.max(0,Math.min(5.2,Math.log2(Math.max(1,dist/1.6))*1.05))});t+=d}
    const od=Math.max(6,s.o*0.045);const o2={c:s.ll,z:s.z,p:66,b:s.b+s.o};SEG.push({k:'orb',t0:t,d:od,a:to,b:o2});t+=od;pv=o2});
  CAP.push(['end',t]);const fin={c:[130.66,32.72],z:8.9,p:40,b:15};SEG.push({k:'fly',t0:t,d:6,a:pv,b:fin,hop:0.6});t+=6;SEG.push({k:'pan',t0:t,d:1.6,a:fin,b:{c:fin.c,z:8.9,p:40,b:17}});t+=1.6;
  const TOTAL=t;window.__tl={total:TOTAL,cap:CAP.map(([n,x])=>[n,+x.toFixed(2)])};
  const camAt=T=>{let g=SEG[SEG.length-1];for(const q of SEG){if(T<q.t0+q.d){g=q;break}}const u=Math.min(1,Math.max(0,(T-g.t0)/g.d));
    if(g.k==='orb'||g.k==='pan')return{center:[lerp(g.a.c[0],g.b.c[0],u),lerp(g.a.c[1],g.b.c[1],u)],zoom:lerp(g.a.z,g.b.z,u),pitch:lerp(g.a.p,g.b.p,ez(u)),bearing:lerp(g.a.b,g.b.b,u)};
    if(g.k==='fly'){const e=ez(u),a=M(g.a.c),b=M(g.b.c);return{center:U([lerp(a[0],b[0],e),lerp(a[1],b[1],e)]),zoom:lerp(g.a.z,g.b.z,e)-g.hop*Math.sin(Math.PI*e),pitch:lerp(g.a.p,g.b.p,e)-8*Math.sin(Math.PI*e),bearing:ang(g.a.b,g.b.b,e)};}
    // 列車：道すじに沿って、少し先を見ながら進む
    const L=g.len[g.len.length-1],at=x=>{x=Math.min(L,Math.max(0,x));let j=1;while(j<g.len.length-1&&g.len[j]<x)j++;const f=(x-g.len[j-1])/(g.len[j]-g.len[j-1]||1);return[lerp(g.pts[j-1][0],g.pts[j][0],f),lerp(g.pts[j-1][1],g.pts[j][1],f)]};
    const e=u<.12?u*u/(.12*1.88):u>.88?1-(1-u)*(1-u)/(.12*1.88):(u-.06)/.88,x=e*L;let c=[0,0];for(let q=-3;q<=3;q++){const p=at(x+q*L*0.012);c[0]+=p[0]/7;c[1]+=p[1]/7}
    const h=at(x+L*0.07),k0=at(x-L*0.03),hd=Math.atan2(h[0]-k0[0],h[1]-k0[1])*180/Math.PI,w=Math.min(1,u/.14),w2=Math.min(1,(1-u)/.12);
    return{center:U(c),zoom:lerp(lerp(g.a.z,12.9,ez(w)),g.b.z,1-ez(w2)),pitch:lerp(g.a.p,66,ez(w))+(62-66)*(1-ez(w2)),bearing:ang(ang(g.a.b,hd+8,ez(w)),g.b.b,1-ez(w2))}};
  window.__camAt=camAt;
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  window.__state='ready';
  window.__shoot=async(doRec,fps=30)=>{window.__state=doRec?'recording':'warming';window.__prog=0;window.__err='';map.setPaintProperty('photo','raster-fade-duration',0);
    const cv=map.getCanvas(),N=Math.round(TOTAL*fps),parts=[];let enc=null,kind='';
    try{if(doRec){const cfgs=[['h264',{codec:'avc1.64002A',width:cv.width,height:cv.height,bitrate:10e6,framerate:fps,avc:{format:'annexb'}}],['vp9',{codec:'vp09.00.40.08',width:cv.width,height:cv.height,bitrate:12e6,framerate:fps}]];
        for(const[kd,c]of cfgs){const r=await VideoEncoder.isConfigSupported(c);if(r.supported){kind=kd;enc=new VideoEncoder({output:ch=>{const b=new Uint8Array(ch.byteLength);ch.copyTo(b);
              if(kind==='vp9'){const h=new DataView(new ArrayBuffer(12));h.setUint32(0,b.length,true);h.setUint32(4,Math.round(ch.timestamp*fps/1e6),true);parts.push(h.buffer)}parts.push(b)},error:e=>{window.__err='enc '+e.message}});enc.configure(c);break}}
        if(!enc)throw new Error('no encoder');window.__kind=kind;
        if(kind==='vp9'){const h=new DataView(new ArrayBuffer(32));'DKIF'.split('').forEach((ch,i)=>h.setUint8(i,ch.charCodeAt(0)));h.setUint16(6,32,true);'VP90'.split('').forEach((ch,i)=>h.setUint8(8+i,ch.charCodeAt(0)));h.setUint16(12,cv.width,true);h.setUint16(14,cv.height,true);h.setUint32(16,fps,true);h.setUint32(20,1,true);h.setUint32(24,N,true);parts.push(h.buffer)}}
      for(let f=0;f<N;f+=(doRec?1:6)){map.jumpTo(camAt(f/fps));let n=0;do{map.redraw();if(map.areTilesLoaded())break;await sleep(30)}while(++n<(doRec?70:25));
        if(doRec){map.redraw();const vf=new VideoFrame(cv,{timestamp:Math.round(f*1e6/fps),duration:Math.round(1e6/fps)});enc.encode(vf,{keyFrame:f%60===0});vf.close();while(enc.encodeQueueSize>6)await sleep(10)}
        window.__prog=f/N;if(f%15===0)await sleep(0);if(window.__err)throw new Error(window.__err)}
      if(doRec){await enc.flush();enc.close();const b=new Blob(parts,{type:'application/octet-stream'});window.__size=b.size;const a=document.createElement('a');a.id='dl';a.href=URL.createObjectURL(b);a.download='kumamoto-sora-koma-'+kind+'.bin';a.textContent='録画を保存する';a.style.cssText='position:fixed;z-index:99;left:760px;top:40px;width:360px;height:120px;display:flex;align-items:center;justify-content:center;background:#e0b565;color:#10151c;font:700 28px sans-serif;border-radius:12px;text-decoration:none';document.body.appendChild(a)}
      window.__prog=1;window.__state='done'}catch(e){window.__err=String(e&&e.message||e);window.__state='error'}}}
if(DBG){$('intro').hidden=true;document.body.insertAdjacentHTML('beforeend','<div id="dbg"></div><div id="cross"></div>');
  const u=()=>{const c=map.getCenter();$('dbg').textContent=c.lng.toFixed(5)+','+c.lat.toFixed(5)+' z'+map.getZoom().toFixed(1)+' b'+map.getBearing().toFixed(0)};map.on('move',u);
  const c=(Q.get('c')||'').split(',').map(Number);if(c.length>=2)map.jumpTo({center:[c[0],c[1]],zoom:c[2]||16,pitch:+Q.get('p')||0,bearing:0});u();
  map.on('click',e=>{$('dbg').textContent+='\nclick '+e.lngLat.lng.toFixed(5)+','+e.lngLat.lat.toFixed(5)});window.__map=map}
}
